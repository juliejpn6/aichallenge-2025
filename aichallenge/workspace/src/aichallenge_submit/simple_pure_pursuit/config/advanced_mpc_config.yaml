# ============================================
# 完全MPC制御システム設定ファイル
# trajectory追従性向上版
# ============================================

advanced_mpc_controller:
  ros__parameters:
    
    # =========================================
    # 基本MPC設定
    # =========================================
    
    # MPC制御の有効/無効
    enable_mpc: true
    
    # 予測時間 [秒] - コーナー形状をどの程度先まで予測するか
    # 【効果】大きくすると軌道全体を考慮、小さくすると応答重視
    # 【推奨】1.5-2.5秒（コーナー1つ分を予測できる長さ）
    mpc_prediction_time: 1.8
    
    # =========================================
    # 重み係数設定（追従性チューニング）
    # =========================================
    
    # trajectory追従重み
    # 【大きくする効果】軌道からの偏差を厳しく制限、忠実な追従
    # 【小さくする効果】軌道から外れても速度重視、自由度UP
    # 【調整範囲】10.0-40.0
    mpc_tracking_weight: 20.0
    
    # 制御滑らかさ重み
    # 【大きくする効果】ステアリング振動を強力に抑制
    # 【小さくする効果】機敏な制御、振動リスク
    # 【調整範囲】5.0-25.0
    mpc_smoothness_weight: 12.0
    
    # =========================================
    # 問題別対応設定
    # =========================================
    
    # 早すぎるハンドル切り対策
    corner_entry_delay_factor: 1.2    # コーナー進入遅延係数
    
    # 遅いハンドル操作対策  
    steering_response_compensation: 0.15  # ステアリング応答補償 [s]
    
    # コーナー出口急激逆ハンドル対策
    corner_exit_smoothing_factor: 0.8     # 出口平滑化係数
    
    # 直線振動対策
    straight_line_stability_weight: 15.0   # 直線安定化重み
    
    # =========================================
    # 安全制約設定
    # =========================================
    
    # 最大ステアリング角 [度]
    max_steering_angle_deg: 70.0
    
    # 最大ステアリング角速度 [rad/s]  
    max_steering_rate: 2.0
    
    # 最大加速度 [m/s²]
    max_acceleration: 3.0
    
    # =========================================
    # デバッグ設定
    # =========================================
    
    # デバッグ情報出力間隔 [秒]
    debug_output_interval: 5.0
    
    # 詳細ログ出力
    enable_detailed_logging: false

# ============================================
# チューニングガイド
# ============================================
#
# 【trajectory追従性を最重視する場合】
# mpc_tracking_weight: 30.0
# mpc_smoothness_weight: 18.0
# mpc_prediction_time: 2.2
#
# 【タイム重視で攻める場合】
# mpc_tracking_weight: 15.0
# mpc_smoothness_weight: 8.0
# mpc_prediction_time: 1.5
#
# 【安定性最重視（推奨）】
# mpc_tracking_weight: 20.0
# mpc_smoothness_weight: 12.0
# mpc_prediction_time: 1.8
#
# ============================================
