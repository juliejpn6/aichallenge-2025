# 高度レーシング制御設定（33秒台達成用）
enhanced_racing_control:
  ros__parameters:
    # 基本車両パラメータ
    wheel_base: 2.14
    max_speed_kmh: 35.0
    max_lateral_g: 0.82
    
    # 高度制御機能
    enable_advanced_control: true
    enable_debug_output: true
    
    # 制御応答性
    control_frequency: 50.0
    steering_response_gain: 1.0
    
    # コーナー分析パラメータ  
    corner_detection_threshold: 0.02
    analysis_lookahead_distance: 15.0
    
    # セルフアライニング設定
    self_aligning_strength: 0.12
    self_aligning_speed_threshold: 20.0
    
    # 安全性パラメータ
    max_steering_angle: 0.6
    max_steering_rate: 1.0
    emergency_brake_threshold: 0.95
