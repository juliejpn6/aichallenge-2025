# ============================================
# 改良版レーシング制御システム設定ファイル
# オーバーステア修正・蛇行抑制対応版
# ============================================

/**:
  ros__parameters:
    # ============================================
    # 基本車両パラメータ
    # ============================================
    wheel_base: 2.14                    # ホイールベース（m）
    max_speed_kmh: 35.0                 # 最大速度（km/h）
                                        # 大きくすると→高速走行、小さくすると→安全走行
    
    max_lateral_g: 0.82                 # 最大横G
                                        # 大きくすると→攻撃的コーナリング、小さくすると→安全コーナリング
    
    # ============================================
    # 制御システム設定
    # ============================================
    enable_debug_output: true           # デバッグ出力有効化
    control_frequency: 20.0             # 制御周波数（Hz）
                                        # 大きくすると→高頻度制御、小さくすると→低負荷
    
    # ============================================
    # オーバーステア防止パラメータ（重要）
    # ============================================
    
    # ステアリング制御パラメータ
    max_steering_rate: 1.2              # 最大ステアリング変化率（rad/s）
                                        # 大きくすると→機敏な制御、小さくすると→穏やかな制御
    
    stability_factor: 0.75              # 基本安定性係数
                                        # 大きくすると→安定重視、小さくすると→応答重視
    
    oversteer_prevention_gain: 0.6      # オーバーステア防止ゲイン
                                        # 大きくすると→強い抑制、小さくすると→弱い抑制
    
    # フェーズ別ステアリングゲイン（オーバーステア対策の核心）
    phase_gains:
      approach: 1.0                     # 進入時ゲイン（通常）
      entry: 1.05                       # 入口ゲイン（やや攻撃的）
                                        # 大きくすると→攻撃的入口、小さくすると→安全入口
      apex: 1.0                         # 中間ゲイン（通常）
      exit: 0.65                        # 【重要】出口ゲイン（大幅削減でオーバーステア防止）
                                        # 小さくすると→より安定、大きくすると→より機敏
      straight_out: 0.45                # 【重要】直線復帰ゲイン（最大削減で蛇行防止）
                                        # 小さくすると→より安定した直線走行
    
    # ============================================
    # コーナー解析パラメータ
    # ============================================
    
    # 曲率判定閾値（保守的設定でオーバーステア抑制）
    curvature_thresholds:
      straight: 0.01                    # 直線判定閾値
                                        # 小さくすると→より多くを曲線判定、大きくすると→直線判定増加
      gentle_curve: 0.03                # 緩カーブ閾値
      normal_corner: 0.08               # 通常コーナー閾値
      tight_corner: 0.15                # タイトコーナー閾値
    
    # 解析窓設定
    analysis_window_size: 15            # コーナー解析窓サイズ
                                        # 大きくすると→安定した判定、小さくすると→敏感な判定
    
    curvature_history_size: 8           # 曲率履歴サイズ
                                        # 大きくすると→平滑化効果強、小さくすると→応答性重視
    
    # フェーズ判定パラメータ
    future_points_check: 5              # 未来点チェック数
                                        # 大きくすると→早期フェーズ検出、小さくすると→遅延検出
    
    exit_detection_ratio: 0.7           # 出口検出比率（70%減少で出口判定）
                                        # 小さくすると→早期出口検出、大きくすると→遅延出口検出
    
    entry_detection_ratio: 1.3          # 入口検出比率（30%増加で入口判定）
